name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  full-check:
    name: Full check (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-transformers-paraphrase-multilingual-minilm-l12-v2

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full check
        run: npm run check

  windows-core:
    name: Core checks (Windows)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository hygiene
        run: npm run check:repo

      - name: Lint and typecheck
        run: npm run lint && npx tsc --noEmit

      - name: Unit and regression tests
        run: npm test
